# Restarts the Supabase database every night at midnight India time, so a
# slow-down that builds up over a day or two is cleared while the cafe is
# closed. Takes the app offline for a few minutes; it then checks the
# database answers again.
#
# Setup (once, in GitHub → Settings → Secrets and variables → Actions):
#   Secret   SUPABASE_ACCESS_TOKEN  a Supabase personal access token
#                                   (supabase.com → Account → Access Tokens)
#   Variable SUPABASE_RESTART_PATH  optional; the Management API restart path,
#                                   default /v1/projects/{ref}/restart
#
# Test it from GitHub → Actions → "Nightly database restart" → Run workflow
# (outside service hours). Choose "check only" to test without restarting.
name: Nightly database restart

on:
  schedule:
    - cron: '30 18 * * *'   # 18:30 UTC = 00:00 India time
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only check the database is up (no restart)'
        type: boolean
        default: false

concurrency:
  group: nightly-db-restart
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: yjbfditboewwpgyqzryd
      SUPABASE_URL: https://yjbfditboewwpgyqzryd.supabase.co
      # The app's public (anon) key, already in index.html; used only to check the database answers.
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqYmZkaXRib2V3d3BneXF6cnlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxNTgwNjcsImV4cCI6MjA4ODczNDA2N30.08Tvq71w2DBeWZrZb-IaiKfoI-2P_1MPJygzSPiRq24
      RESTART_PATH: ${{ vars.SUPABASE_RESTART_PATH || '/v1/projects/{ref}/restart' }}
      ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Restart the database
        if: ${{ !inputs.check_only }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          path="${RESTART_PATH//\{ref\}/$PROJECT_REF}"
          echo "POST https://api.supabase.com$path"
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST "https://api.supabase.com$path" \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code"; head -c 600 resp.txt; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Supabase refused the restart (HTTP $code). If it is 404, set the SUPABASE_RESTART_PATH variable to the restart path from Supabase's Management API docs."
            exit 1
          fi
          sleep 60

      - name: Check the database answers
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              "$SUPABASE_URL/rest/v1/app_settings?select=key&limit=1" \
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" || true)
            echo "Try $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "Database is up."; exit 0; fi
            sleep 20
          done
          echo "::error::The database did not answer within 10 minutes. Check the Supabase dashboard."
          exit 1
