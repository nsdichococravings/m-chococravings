<style>
/* Same colours as the admin dashboard, so the NSDI Store tools look the same in both places. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#6B2FCE;--p2:#8B44E8;--pl:#C084FC;--pg:rgba(107,47,206,.12);
  --dark:#09010F;--d2:#110020;--d3:#1C003A;--d4:#0F0018;
  --white:#FAF5FF;--off:#E9D5FF;--dim:#9F7ABA;--faint:#4A3060;
  --green:#22C55E;--gold:#F59E0B;--red:#EF4444;
  --card:rgba(255,255,255,.035);--bdr:rgba(255,255,255,.07);--bdr2:rgba(107,47,206,.25);
}
html,body{background:var(--dark);color:var(--white);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}
a{color:var(--pl)}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--d4);border-bottom:1px solid var(--bdr)}
.top a{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;color:var(--white);text-decoration:none;font-size:18px}
.top .t{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;flex:1}
.top .shop{width:auto;padding:0 12px;font-size:13px;font-weight:700}
#view-grocery{max-width:980px;margin:0 auto}
#notif-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140%);transition:transform .25s;z-index:1000;background:#1d1030;border:1px solid var(--bdr2);border-radius:14px;padding:12px 16px;min-width:240px;max-width:92vw;box-shadow:0 12px 30px rgba(0,0,0,.4)}
#notif-toast.show{transform:translateX(-50%) translateY(0)}
#nt-title{font-weight:700;font-size:14px}#nt-body{font-size:12.5px;color:var(--dim);margin-top:2px}
</style>
</head>

var toastTimer;
function showToast(title, body) {
  document.getElementById('nt-title').textContent = title;
