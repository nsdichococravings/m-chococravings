<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#4a0752"/>
<title>NSDI Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="preconnect" href="https://yjbfditboewwpgyqzryd.supabase.co" crossorigin/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-net.js?v=20261018"></script>
<style>
:root{
  --ink:#16101a; --ink2:#3d3342; --muted:#76697b; --line:#ece6ef; --bg:#f4f1f6; --card:#ffffff;
  --brand:#6e0977; --brand-d:#4a0752; --brand-l:#f6ecf8; --gold:#f2b705; --gold-d:#a77a00;
  --deal:#cc0c39; --ok:#0a7c3e; --ok-l:#e8f6ee; --warn:#c2410c; --warn-l:#fff3ea; --amber:#9a5b00;
  --r:16px; --shadow:0 1px 2px rgba(22,16,26,.06),0 4px 14px rgba(22,16,26,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:var(--ink)}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(96px + env(safe-area-inset-bottom));background:var(--bg)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1 1 0;min-width:0}
.muted{color:var(--muted)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Header */
.hdr{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#3a0541 0%,#6e0977 55%,#a12a77 100%);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;box-shadow:0 6px 18px rgba(74,7,82,.25)}
.hdr-top{display:flex;align-items:center;gap:10px}
.hbtn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(255,255,255,.14);flex-shrink:0;color:#fff}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#f9d55b,#f2b705);display:flex;align-items:center;justify-content:center;color:#3a0541;font-weight:800;font-size:13px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.brand-name{font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1}
.brand-sub{font-size:11px;opacity:.82;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--gold);color:#2b1d00;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #6e0977}
.loc{display:flex;align-items:center;gap:6px;font-size:12px;margin:10px 0;opacity:.95}
.loc b{font-weight:700}
.loc .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:0 14px;height:46px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.search input{border:0;outline:none;background:none;flex:1;min-width:0;font-size:14.5px}
.search input::placeholder{color:#8c8091}
.subhdr{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:10px}
.subhdr .hbtn{background:var(--brand-l);color:var(--brand)}
.subhdr .count{border-color:#fff}
.sub-title{font-weight:800;font-size:17px;letter-spacing:-.01em}
.sub-sub{font-size:11.5px;color:var(--muted)}

/* Strips */
.notice{margin:12px 12px 0;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45;display:flex;gap:10px;align-items:center}
.notice.info{background:#fff7db;color:#5c4300}
.notice.staff{background:#1d1020;color:#fff}
.notice.err{background:#fde8ec;color:#8a1630}
.notice .act{margin-left:auto;flex-shrink:0;background:var(--gold);color:#2b1d00;font-weight:800;font-size:12px;padding:8px 11px;border-radius:9px;white-space:nowrap}
.cats{display:flex;gap:12px;overflow-x:auto;padding:14px 14px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;width:64px}
.cat i{width:58px;height:58px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:27px;font-style:normal;box-shadow:var(--shadow);border:2px solid transparent}
.cat span{font-size:11.5px;font-weight:600;color:var(--ink2);text-align:center;line-height:1.2}
.cat.on i{border-color:var(--brand);background:var(--brand-l)}
.cat.on span{color:var(--brand);font-weight:800}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px 10px;gap:10px}
.sec-t{font-weight:800;font-size:17px;letter-spacing:-.015em}
.sec-s{font-size:12px;color:var(--muted);margin-top:2px}
.sec-a{font-size:13px;font-weight:700;color:var(--brand);white-space:nowrap;padding:4px 0}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 14px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}

/* Hero: tall vertical cards */
.hero{flex:0 0 74%;max-width:300px;aspect-ratio:4/5.4;border-radius:22px;overflow:hidden;position:relative;scroll-snap-align:start;box-shadow:0 10px 28px rgba(40,10,50,.18);display:block;isolation:isolate}
.hero-art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:34%}
.hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero.photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(14,4,18,.82) 100%);z-index:1;pointer-events:none}
.hero-tag{position:absolute;top:14px;left:14px;z-index:2;font-size:11px;font-weight:800;letter-spacing:.04em;padding:5px 10px;border-radius:8px;color:#fff;background:var(--deal)}
.hero-brand{position:absolute;top:14px;right:14px;z-index:2;font-size:9.5px;font-weight:800;letter-spacing:.14em;padding:5px 8px;border-radius:7px;background:rgba(58,5,65,.85);color:#f9d55b}
.hero-body{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px;display:flex;flex-direction:column;gap:6px}
.hero.photo .hero-body{color:#fff}
.hero-title{font-weight:800;font-size:21px;line-height:1.1;letter-spacing:-.02em}
.hero-sub{font-size:12.5px;opacity:.9}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.hero-price b{font-size:20px;font-weight:800}.hero-price s{font-size:12px;opacity:.75;margin-left:6px}
.hero-cta{background:#fff;color:var(--brand-d);font-weight:800;font-size:13px;padding:10px 14px;border-radius:12px;white-space:nowrap}
.dots{display:flex;justify-content:center;gap:5px;padding-top:2px}
.dots button{padding:8px 2px}
.dots span{display:block;height:5px;width:5px;border-radius:3px;background:#d8cddd;transition:width .3s,background .3s}
.dots .on span{width:20px;background:var(--brand)}

/* Trust */
.trust{margin:16px 14px 0;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(3,1fr)}
.trust div{padding:12px 6px;text-align:center;font-size:11px;color:var(--ink2);font-weight:600;line-height:1.3}
.trust div+div{border-left:1px solid var(--line)}
.trust i{display:block;font-style:normal;font-size:20px;margin-bottom:4px}

/* Product card */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 12px}
.pc{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
.hs .pc{flex:0 0 152px;scroll-snap-align:start}
.pc-img{position:relative;aspect-ratio:1/1;background:#faf6ee;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pc-img img{width:100%;height:100%;object-fit:cover}
.off{position:absolute;top:8px;left:8px;z-index:1;background:var(--deal);color:#fff;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:6px;letter-spacing:.02em}
.ntag{position:absolute;bottom:8px;left:8px;font-size:8.5px;font-weight:800;letter-spacing:.14em;background:rgba(58,5,65,.85);color:#f9d55b;padding:3px 6px;border-radius:5px}
.pc-body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.pc-unit{font-size:11px;color:var(--muted);font-weight:600}
.pc-name{font-size:13.5px;font-weight:700;line-height:1.3;min-height:2.6em}
.pc-price{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.pc-price b{font-size:16px;font-weight:800}
.pc-price s{font-size:11.5px;color:var(--muted)}
.pc-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:8px}
.sig{font-size:11px;font-weight:700;line-height:1.25}
.sig.low{color:var(--warn)}.sig.fast{color:var(--amber)}.sig.ok{color:var(--ok)}.sig.out{color:var(--deal)}
.addb{min-width:74px;height:34px;border-radius:10px;border:1.5px solid var(--brand);color:var(--brand);background:#fff;font-weight:800;font-size:13px;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.step{display:inline-flex;align-items:center;height:34px;border-radius:10px;background:var(--brand);color:#fff;overflow:hidden;min-width:84px}
.step button{width:28px;height:34px;color:inherit;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step span{flex:1;text-align:center;font-weight:800;font-size:13.5px;min-width:22px}
.step.lg{height:48px;border-radius:14px;min-width:116px}.step.lg button{width:38px;height:48px;font-size:22px}.step.lg span{font-size:16px}
.step.soft{background:#f4f1f6;color:var(--brand)}

/* Pack art (until a photo is added) */
.pack{border-radius:30px 30px 12px 12px;background:linear-gradient(160deg,#fff,#f3ead2);border:2px solid #d9b443;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;overflow:hidden;box-shadow:0 12px 26px rgba(60,30,0,.18)}
.pack b{width:100%;background:linear-gradient(90deg,#5a0763,#7e1588);color:#fff;text-align:center;font-weight:800}
.pack i{font-style:normal;font-weight:800;letter-spacing:.14em;color:#4a0752}

/* Promo */
.promo{margin:18px 14px 0;border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);text-align:left;width:calc(100% - 28px)}
.promo-ico{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.promo-t{font-weight:800;font-size:15.5px;letter-spacing:-.01em}
.promo-s{font-size:12.5px;margin-top:3px;opacity:.85}
.promo-go{font-weight:800;font-size:13px;padding:9px 13px;border-radius:11px;flex-shrink:0;color:#fff}

/* Bag bar */
.bagbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.bagbar a{pointer-events:auto;max-width:536px;margin:0 auto;height:60px;border-radius:16px;background:linear-gradient(90deg,#4a0752,#7a1386);color:#fff;display:flex;align-items:center;gap:12px;padding:0 10px 0 12px;box-shadow:0 12px 30px rgba(74,7,82,.4)}
.bb-ico{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
.bb-t{font-weight:800;font-size:14px}.bb-s{font-size:11.5px;opacity:.85}
.bb-go{margin-left:auto;font-weight:800;font-size:14px;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);padding:10px 12px;border-radius:12px}

/* Product page */
.pd-gal{position:relative;background:#fff}
.pd-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:1/1}
.pd-track::-webkit-scrollbar{display:none}
.pd-track > div{flex:0 0 100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;background:#faf6ee}
.pd-track img{width:100%;height:100%;object-fit:cover}
.pd-top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;z-index:3}
.pd-top .hbtn{background:rgba(255,255,255,.95);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.pd-top .count{border-color:#fff}
.pd-dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:2}
.pd-dots span{width:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.2)}.pd-dots span.on{width:18px;background:var(--brand)}
.panel{background:#fff;margin-top:10px;padding:16px 14px}
.pd-brand{font-size:12.5px;font-weight:700;color:var(--brand)}
.pd-name{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:3px}
.pd-unit{display:inline-flex;margin-top:10px;border:1.5px solid var(--brand);background:var(--brand-l);color:var(--brand);font-weight:800;font-size:12.5px;padding:6px 12px;border-radius:10px}
.pd-price{display:flex;align-items:baseline;gap:10px;margin-top:14px;flex-wrap:wrap}
.pd-price .pct{color:var(--deal);font-size:22px;font-weight:600}
.pd-price b{font-size:28px;font-weight:800;letter-spacing:-.02em}
.pd-mrp{font-size:12.5px;color:var(--muted);margin-top:2px}
.save{display:inline-flex;margin-top:8px;background:var(--ok-l);color:var(--ok);font-weight:800;font-size:12px;padding:5px 9px;border-radius:8px}
.urg{border-radius:14px;padding:12px 14px;margin-top:14px;display:flex;flex-direction:column;gap:8px}
.bar{height:6px;border-radius:3px;background:rgba(0,0,0,.08);overflow:hidden}.bar > div{height:100%;border-radius:3px}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.feat div{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:11px;font-weight:600;color:var(--ink2);line-height:1.3}
.feat i{display:block;font-style:normal;font-size:19px;margin-bottom:4px}
.pick{display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.45}
.pick-ico{width:40px;height:40px;border-radius:12px;background:var(--ok-l);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.h3{font-weight:800;font-size:15px;margin-bottom:10px;letter-spacing:-.01em}
.spec{display:grid;grid-template-columns:42% 1fr;font-size:13px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.spec div{padding:9px 12px;border-bottom:1px solid var(--line)}
.spec div:nth-child(odd){background:#faf8fb;color:var(--muted);font-weight:600}
.spec div:nth-last-child(-n+2){border-bottom:0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(22,16,26,.06)}
.dock-in{max-width:536px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{height:48px;border-radius:14px;font-weight:800;font-size:15px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:-.01em}
.btn-p{background:linear-gradient(90deg,#5a0763,#7e1588);color:#fff}
.btn-y{background:var(--gold);color:#2b1d00}
.btn-o{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}

/* Checkout */
.ck-card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin:12px 12px 0;padding:14px}
.ck-line{display:flex;align-items:center;gap:12px;padding:10px 0}
.ck-line + .ck-line{border-top:1px dashed var(--line)}
.thumb{width:56px;height:56px;border-radius:12px;background:#faf6ee;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.pay-opt{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:14px;width:100%;text-align:left}
.pay-opt + .pay-opt{margin-top:10px}
.pay-opt[aria-checked="true"]{border-color:var(--brand);background:var(--brand-l)}
.pay-opt[disabled]{opacity:.5}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #c9bccd;flex-shrink:0;position:relative}
.pay-opt[aria-checked="true"] .radio{border-color:var(--brand)}
.pay-opt[aria-checked="true"] .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--brand)}
.pay-ico{width:40px;height:40px;border-radius:11px;background:#f4f1f6;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.bill > div{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;font-variant-numeric:tabular-nums}
.bill .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-weight:800;font-size:16px}
.saving{margin:12px 12px 0;border-radius:14px;background:var(--ok-l);color:var(--ok);font-weight:700;font-size:13px;padding:11px 14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.field input{height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:15px;font-weight:500;background:#fff;color:var(--ink);width:100%}
.field input:focus{border-color:var(--brand);outline:none}

/* Order */
.ok-hero{position:relative;background:linear-gradient(160deg,#0a7c3e,#14a35a);color:#fff;padding:calc(26px + env(safe-area-inset-top)) 20px 66px;text-align:center}
.ok-hero.wait{background:linear-gradient(160deg,#9a5b00,#d58a00)}
.ok-hero.bad{background:linear-gradient(160deg,#7c1230,#b91c48)}
.ok-ring{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.ticket{background:#fff;margin:-46px 14px 0;border-radius:20px;box-shadow:0 10px 30px rgba(22,16,26,.12);padding:18px;text-align:center;position:relative}
.ono{font-size:30px;font-weight:800;letter-spacing:.04em;color:var(--brand-d);margin-top:4px}
.perf{border-top:2px dashed var(--line);margin:16px -18px 14px}
.tl{text-align:left}
.tl-s{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.tl-s:last-child{padding-bottom:0}
.tl-s::before{content:'';position:absolute;left:9px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl-s:last-child::before{display:none}
.tl-s i{width:20px;height:20px;border-radius:50%;border:2px solid #d8cddd;background:#fff;flex-shrink:0;z-index:1}
.tl-s.on i{background:var(--ok);border-color:var(--ok)}
.tl-s.on::before{background:var(--ok)}
.tl-s.now i{box-shadow:0 0 0 5px rgba(10,124,62,.18)}
.tl-s b{font-size:14px}.tl-s span{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
.oitem{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin:10px 12px 0;padding:14px;display:flex;gap:12px;align-items:center}

/* Ask */
.ask-hero{background:linear-gradient(150deg,#e6f6ef,#c8eedb);padding:20px 16px 18px}
.ask-hero h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:#0d3b2e}
.ask-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 12px 0}
.ask-c{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid transparent;position:relative;font-size:12.5px;font-weight:700;color:var(--ink2);text-align:center}

/* ══ Boutique look: same ivory, plum, gold and type as the ChocoCravings app ══ */

body{font-family:'DM Sans','Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);-webkit-font-smoothing:antialiased}

/* Header */
.hdr{background:radial-gradient(120% 120% at 100% 0%,rgba(255,233,194,.14),transparent 55%),linear-gradient(135deg,#2b0a35 0%,#5a0b63 60%,#1a0820 100%);

.brand-name{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:0}
.brand-sub{font-size:11px;letter-spacing:.04em;opacity:.75}
.count{background:#ffe9c2;color:#3a0a46}
.loc{font-size:12px;opacity:.85}

/* Notices */
.notice{border-radius:16px}
.notice.staff{background:linear-gradient(135deg,#2b0a35,#5a0b63)}
.notice .act{border-radius:999px;background:#ffe9c2;color:#3a0a46}

/* Categories */
.cats{padding:18px 16px 4px}
.cat i{width:60px;height:60px;border-radius:50%;background:#fffdfa;border:1px solid var(--line);box-shadow:var(--shadow)}
.cat span{font-size:11.5px;font-weight:600;color:var(--ink2)}
.cat.on i{border-color:var(--plum);background:#fff;box-shadow:0 0 0 3px rgba(110,9,119,.1),var(--shadow)}
.cat.on span{color:var(--plum);font-weight:700}

/* Section headers */
.sec{margin-top:22px}
.sec-h{padding:0 16px 12px}
.sec-t{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:0;color:var(--plum);line-height:1.05}
.sec-s{font-size:12px;color:var(--muted)}
.sec-a{font-size:12.5px;font-weight:600;color:#6e0977;border:1px solid var(--line);background:#fffdfa;border-radius:999px;padding:7px 13px}

/* Hero rail */
.hs{padding:2px 16px 12px}
.hero{border-radius:24px;box-shadow:0 18px 34px -22px rgba(36,5,45,.55);aspect-ratio:4/4.7;max-width:280px}
.hero-art{padding-bottom:40%}
.hero-tag{border-radius:999px;font-size:9.5px;letter-spacing:.14em;padding:5px 11px}

.hero-sub{font-size:12.5px;opacity:.8}

.dots .on span{background:var(--plum)}

/* Trust strip */
.trust{margin:18px 16px 0;background:#fffdfa;border:1px solid var(--line);border-radius:20px}

/* Product cards */

.promo-t{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--plum)}

function cleanErr(e) {

  if (/AbortError|timed out|Failed to fetch|NetworkError/i.test(m)) return 'Network is slow. Please check your connection and try again.';

// Badges use only real stock and real sales today (no made-up urgency).
function badge(p) {
  var a = p.available;
  if (a <= 0) return { text: 'Sold out', cls: 'out', color: 'var(--deal)', bg: '#fdecef', soldOut: true, w: 0 };
  var fast = p.sold_today >= p.selling_fast_level ? 'Selling fast · ' + p.sold_today + ' sold today' : '';
  if (a <= p.low_stock_level) return { text: 'Only ' + a + ' left', cls: 'low', color: 'var(--warn)', bg: 'var(--warn-l)', fast: fast, w: Math.max(8, Math.round(a / Math.max(p.low_stock_level, 1) * 100)) };
  return { text: fast ? '🔥 ' + fast : 'In stock', cls: fast ? 'fast' : 'ok', color: fast ? 'var(--amber)' : 'var(--ok)', bg: fast ? '#fff6e0' : 'var(--ok-l)', fast: fast, inStock: true };

// Bag
function bagLines() { return Object.keys(S.bag).map(function (id) { var p = findP(id); return p ? { p: p, qty: S.bag[id] } : null; }).filter(Boolean); }
function bagCount() { return bagLines().reduce(function (n, l) { return n + l.qty; }, 0); }
function bagTotal() { return bagLines().reduce(function (n, l) { return n + l.p.price * l.qty; }, 0); }
function bagMrp() { return bagLines().reduce(function (n, l) { return n + l.p.mrp * l.qty; }, 0); }
function maxPer() { return (S.cat && S.cat.settings && S.cat.settings.max_qty_per_item) || 5; }
function maxQty(p) { return Math.max(0, Math.min(maxPer(), p.available)); }
function limitMsg(m) { return m < maxPer() ? 'Only ' + m + ' available' : 'Up to ' + m + ' per order'; }
function setQty(id, qty) {
  var p = findP(id); if (!p) return;
  var m = maxQty(p);
  if (qty > m) { toast(limitMsg(m)); qty = m; }
  qty = Math.max(0, qty);
  if (qty === 0) delete S.bag[id]; else S.bag[id] = qty;
  writeJSON(BAG_KEY, S.bag); render();
}
function add(id, qty, then) {
  var p = findP(id); if (!p) return;
  var cur = S.bag[id] || 0, want = cur + (qty || 1), max = maxQty(p);
  if (max <= 0) return toast('Sold out right now');
  if (want > max) { want = max; toast(limitMsg(max)); }
  else if (!then) toast('Added to cart');
  S.bag[id] = want; writeJSON(BAG_KEY, S.bag);
  if (then) go(then); else render();
}
function pruneBag() {
  var changed = false;
  Object.keys(S.bag).forEach(function (id) {
    var p = findP(id);
    if (!p) { if (S.cat) { delete S.bag[id]; changed = true; } return; }
    var m = maxQty(p); if (S.bag[id] > m) { if (m) S.bag[id] = m; else delete S.bag[id]; changed = true; }
  });
  if (changed) writeJSON(BAG_KEY, S.bag);
}

  }
  var n = list && list.length;
  return '<div class="cx cx-page go">' + cxHdr('My Orders', n ? n + (n === 1 ? ' order' : ' orders') + ' · NSDI Store' : 'NSDI Store · outlet pickup', '#/') + body + '<div style="height:24px"></div></div>';
}

var ASK = [['atta', 'Atta', '🌾'], ['rice', 'Rice', '🍚'], ['toor-dal', 'Toor dal', '🫘'], ['moong-dal', 'Moong dal', '🫛'], ['sugar', 'Sugar', '🍬'], ['oil', 'Cooking oil', '🫒'],
  ['tea', 'Tea powder', '🍵'], ['coffee', 'Coffee powder', '☕'], ['salt', 'Salt', '🧂'], ['ghee', 'Ghee', '🧈'], ['rava', 'Rava', '🥣'], ['spices', 'Spices & masala', '🌶️']];
function screenAsk() {
  var done = S.myReq || [];
  if (S.sentCount) {
    return subHeader('Your say', 'NSDI Store', '#/') + '<div class="empty"><div style="width:72px;height:72px;border-radius:50%;background:var(--ok-l);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto">' + I.check + '</div>'
      + '<h2>Thank you!</h2><p style="font-size:14px;color:var(--ink2);line-height:1.5">We noted ' + S.sentCount + (S.sentCount === 1 ? ' item' : ' items') + '. When they\'re in stock you\'ll get a notification, and they\'ll show first in NSDI Store.</p>'
      + '<button class="btn btn-p" style="margin-top:16px" id="ask-back">Back to NSDI Store</button></div>';
  }
  var picked = Object.keys(S.picks).filter(function (k) { return S.picks[k]; }).length + (S.other.trim() ? 1 : 0);
  return subHeader('Your say', 'NSDI Store', '#/')
    + '<div class="ask-hero"><h1>What should we stock for you?</h1><p style="font-size:13.5px;color:#245c4a;margin-top:6px;line-height:1.5">Tap everything you\'d pick up with your coffee. We bring in the most-asked items first and tell you when they arrive.</p></div>'
    + '<div class="ask-grid" role="group" aria-label="Items">' + ASK.map(function (a) {
      if (done.indexOf(a[0]) >= 0) return '<div class="ask-c done"><i>' + a[2] + '</i>' + h(a[1]) + '</div>';
      return '<button class="ask-c" data-pick="' + a[0] + '" aria-pressed="' + !!S.picks[a[0]] + '"><i>' + a[2] + '</i>' + h(a[1]) + '</button>';
    }).join('') + '</div>'
    + '<div class="ck-card"><label class="field">Anything else? Brand or pack size helps<input id="ask-other" placeholder="e.g. Aashirvaad atta 10 kg" maxlength="60" value="' + h(S.other) + '"></label>'
    + '<label class="row" style="font-size:13px;color:var(--ink2);margin-top:12px;min-height:40px"><input id="ask-notify" type="checkbox" checked style="width:20px;height:20px;accent-color:var(--brand)"> Tell me when these arrive</label>'
    + (done.length ? '<p class="muted" style="font-size:12px;margin-top:6px">Faded items are already on your list.</p>' : '') + '</div>'
    + (S.error ? '<div class="notice err" role="alert">' + h(S.error) + '</div>' : '')
    + '<div class="dock"><div class="dock-in"><button class="btn btn-p btn-block" id="ask-send"' + (S.busy || !picked ? ' disabled' : '') + '>'
    + (S.busy ? 'Sending…' : (!S.session ? 'Sign in to send' : (picked ? 'Send my list (' + picked + ')' : 'Pick at least one item'))) + '</button></div></div>';
}

// Router
var route = { name: 'store' };
function parse() {
  var hsh = location.hash.replace(/^#\/?/, '').split('/');
  if (hsh[0] === 'p' && hsh[1]) return { name: 'product', id: hsh[1] };
  if (hsh[0] === 'o' && hsh[1]) return { name: 'order', id: hsh[1] };
  if (hsh[0] === 'checkout' || hsh[0] === 'orders' || hsh[0] === 'ask') return { name: hsh[0] };
  return { name: 'store' };
}
var railTimer, pollTimer;
function render() {
  var app = document.getElementById('app'), html;
  switch (route.name) {
    case 'product': html = screenProduct(route.id); break;
    case 'checkout': html = screenCheckout(); break;
    case 'order': html = screenOrder(route.id); break;
    case 'orders': html = screenOrders(); break;
    case 'ask': html = screenAsk(); break;
    default: html = screenStore();
  }
  // Keep horizontal scroll positions and the focused field across redraws.
  var keep = {}; Array.prototype.forEach.call(app.querySelectorAll('[data-keep]'), function (el) { keep[el.dataset.keep] = el.scrollLeft; });
  var focused = document.activeElement && document.activeElement.id, caret = null;
  try { caret = focused && document.activeElement.selectionStart; } catch (e) {}
  app.innerHTML = html;
  Array.prototype.forEach.call(app.querySelectorAll('[data-keep]'), function (el) { if (keep[el.dataset.keep]) el.scrollLeft = keep[el.dataset.keep]; });
  if (focused) { var el = document.getElementById(focused); if (el && el.focus) { el.focus({ preventScroll: true }); try { if (caret != null) el.setSelectionRange(caret, caret); } catch (e) {} } }
  if (route.name === 'store') startRail(); else clearInterval(railTimer);
  var gal = document.getElementById('gallery'), pd = document.getElementById('pdots');
  if (gal && pd) gal.addEventListener('scroll', function () { var i = Math.round(gal.scrollLeft / gal.clientWidth); Array.prototype.forEach.call(pd.children, function (d, j) { d.classList.toggle('on', i === j); }); }, { passive: true });
}
var railHold = false;
function startRail() {
  clearInterval(railTimer);
  var rail = document.getElementById('rail'), dots = document.getElementById('dots');
  if (!rail || !dots) return;
  var idx = 0;
  function mark() {
    var w = rail.children[0] ? rail.children[0].offsetWidth + 12 : 252;
    idx = Math.round(rail.scrollLeft / w);
    Array.prototype.forEach.call(dots.children, function (d, i) { d.classList.toggle('on', i === idx); });
  }
  mark();
  rail.addEventListener('scroll', function () { window.requestAnimationFrame(mark); }, { passive: true });
  rail.addEventListener('pointerdown', function () { railHold = true; });
  rail.addEventListener('touchstart', function () { railHold = true; }, { passive: true });
  dots.addEventListener('click', function (e) { var b = e.target.closest('[data-dot]'); if (!b) return; railHold = true; var c = rail.children[+b.dataset.dot]; if (c) rail.scrollTo({ left: c.offsetLeft - 14, behavior: 'smooth' }); });
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  railTimer = setInterval(function () {
    if (railHold || document.hidden) return;
    var next = (idx + 1) % rail.children.length, c = rail.children[next];
    if (c) rail.scrollTo({ left: next === 0 ? 0 : c.offsetLeft - 14, behavior: 'smooth' });
  }, 4500);
}

async function onRoute() {
  route = parse(); S.error = ''; clearInterval(pollTimer);
  if (route.name !== 'ask') S.sentCount = 0;
  if (route.name === 'product' && (!S.pq || S.pq.id !== route.id)) S.pq = { id: route.id, n: 1 };
  render(); window.scrollTo(0, 0);
  try {
    if (route.name === 'order') { await loadOrder(route.id); pollTimer = setInterval(function () { if (!document.hidden) loadOrder(route.id).catch(function () {}); }, 20000); }
    if (route.name === 'orders' && S.session) { var r = await db.rpc('grocery_my_orders', { p_limit: 20 }); if (r.error) throw r.error; S.orders = r.data; render(); }
    if (route.name === 'ask' && S.session && !S.myReq) { var q = await db.rpc('grocery_my_requests'); if (!q.error) { S.myReq = q.data || []; render(); } }
    if (route.name === 'checkout' && S.session && !S.me) { await loadMe(); render(); }
  } catch (e) { S.error = cleanErr(e); render(); }
}
async function loadOrder(id) {
  var r = await db.rpc('grocery_order', { p_order_id: id });
  if (r.error) throw r.error;
  if (!r.data) { S.error = 'Order not found.'; render(); return; }
  var was = S.order && S.order.id === id && S.order.status;
  S.order = r.data;
  if (route.name === 'order' && route.id === id) { render(); if (was && was !== r.data.status && r.data.status === 'ready') toast('Your order is ready for pickup'); }
}

// Actions
function checkoutSig() { return JSON.stringify(S.bag) + '|' + S.payBy; }
async function placeOrder() {
  if (!S.session) return needSignIn('#/checkout');
  var name = (document.getElementById('ck-name') || {}).value || '', phone = (document.getElementById('ck-phone') || {}).value || '';
  if (name.trim().length < 2) { S.error = 'Please enter your name for pickup.'; return render(); }
  if (phone.replace(/\D/g, '').length < 10) { S.error = 'Please enter a 10-digit phone number.'; return render(); }
  S.me = { name: name.trim(), phone: phone.trim() };
  // Same key for retries of the same bag, so a double tap or a slow network never makes two orders.
  var sig = checkoutSig(); if (!S.checkoutKey || S.checkoutSig !== sig) { S.checkoutKey = uuid(); S.checkoutSig = sig; }
  S.busy = true; S.error = ''; render();
  try {
    var items = bagLines().map(function (l) { return { product_id: l.p.id, qty: l.qty }; });
    var r = await db.rpc('grocery_place_order', { p_items: items, p_payment_method: S.payBy, p_name: name.trim(), p_phone: phone.trim(), p_idempotency_key: S.checkoutKey, p_expected_total: bagTotal() });
    if (r.error) throw r.error;
    var o = r.data;
    S.bag = {}; writeJSON(BAG_KEY, S.bag); S.checkoutKey = null; S.order = o; S.orders = null; S.busy = false;
    loadCatalog().catch(function () {});
    if (o.payment_method === 'online' && o.status === 'awaiting_payment') { location.hash = '#/o/' + o.id; await payOrder(o); }
    else { location.hash = '#/o/' + o.id; toast('Order placed'); }
  } catch (e) {
    S.busy = false; S.error = cleanErr(e);
    if (/PRICE_CHANGED|no longer sold|only \d+ left/i.test((e && e.message) || '')) { try { await loadCatalog(); } catch (x) {} }
    render();
  }
}
function loadRazorpay() {
  if (window.Razorpay) return Promise.resolve();
  return new Promise(function (ok, bad) {
    var s = document.createElement('script'); s.src = 'https://checkout.razorpay.com/v1/checkout.js';
    s.onload = ok; s.onerror = function () { bad(new Error('Could not open payment. Please check your connection.')); };
    document.head.appendChild(s);
  });
}
function payingOverlay(on, text) {
  var el = document.getElementById('paying');
  if (!on) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'paying'; el.className = 'paying'; document.body.appendChild(el); }
  el.innerHTML = '<div class="spin"></div><div style="font-size:15px;font-weight:700">' + h(text) + '</div>';
}
async function payOrder(o) {
  S.busy = true; S.error = ''; render(); payingOverlay(true, 'Opening secure payment…');
  try {
    await loadRazorpay();
    var sess = await signedIn();
    if (!sess) throw new Error('Please sign in again');
    var res = await fetch(SUPABASE_URL + '/functions/v1/create-razorpay-order', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sess.access_token },
      // Amount comes from the order the database priced, never from the bag on this screen.
      body: JSON.stringify({ amount: Math.max(1, Math.round(Number(o.total))), receipt: o.order_no, notes: { order_number: o.order_no, module: 'nsdi_store' } })
    });
    var rz = await res.json();
    if (!rz || !rz.id) throw new Error((rz && rz.error) || 'Could not start payment');
    payingOverlay(false);
    await new Promise(function (resolve) {
      var rzp = new window.Razorpay({
        key: rz.key_id || rz.key || RAZORPAY_KEY_ID, amount: rz.amount, currency: 'INR', name: 'NSDI Store', description: 'Order ' + o.order_no, order_id: rz.id,
        image: 'https://yjbfditboewwpgyqzryd.supabase.co/storage/v1/object/public/product-images/Original_on_transparent.png',
        prefill: { name: o.name || '', contact: o.phone || '', email: (sess.user && sess.user.email) || '' },
        theme: { color: '#6e0977' },
        modal: { ondismiss: function () { S.busy = false; toast('Payment not completed. You can pay from this screen.'); render(); resolve(); } },
        handler: function (resp) {
          payingOverlay(true, 'Confirming payment…');
          recordPayment(o.id, resp.razorpay_payment_id, resp.razorpay_order_id || rz.id).then(resolve, resolve);
        }
      });
      rzp.on && rzp.on('payment.failed', function () { toast('Payment failed. Please try again.'); });
      rzp.open();
    });
  } catch (e) { payingOverlay(false); S.busy = false; S.error = cleanErr(e); render(); }
}
async function recordPayment(orderId, payId, rzpOrderId) {
  // Keep the payment id safe until it is saved, so a lost connection can be retried.
  writeJSON('ns_pending_pay', { o: orderId, p: payId, r: rzpOrderId, at: Date.now() });
  for (var i = 0; i < 4; i++) {
    try {
      var r = await confirmPayment(orderId, payId, rzpOrderId);
      localStorage.removeItem('ns_pending_pay');
      S.order = r.data; S.busy = false; payingOverlay(false);
      toast(r.data.payment_status === 'paid' ? 'Payment received. Order placed!' : 'Payment received after the hold ended. We will refund it.');
      render(); return;
    } catch (e) {
      if (!/network|slow|fetch|timed out|abort|not complete yet/i.test(cleanErr(e))) { payingOverlay(false); S.busy = false; S.error = cleanErr(e); render(); return; }
      await new Promise(function (r) { setTimeout(r, 1500 * (i + 1)); });
    }
  }
  payingOverlay(false); S.busy = false;
  S.error = 'Payment done, but we could not confirm it yet. Keep this screen open or reopen NSDI Store; it will retry.'; render();
}
// The grocery-payment edge function checks the payment with Razorpay before
// the order is marked paid; the app can't mark it paid by itself.
async function confirmPayment(orderId, payId, rzpOrderId) {
  var sess = await signedIn();
  if (!sess) throw new Error('Please sign in again');
  var res = await fetch(SUPABASE_URL + '/functions/v1/grocery-payment', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sess.access_token },
    body: JSON.stringify({ order_id: orderId, payment_id: payId, rzp_order_id: rzpOrderId || null })
  });
  var data = await res.json().catch(function () { return null; });
  if (!data) throw new Error('Network error, please retry');
  if (!res.ok || data.error) throw new Error(data.error || 'Could not confirm payment');
  return { data: data };
}
async function retryPendingPayment() {
  var p = readJSON('ns_pending_pay');
  if (p && p.o && p.p && Date.now() - p.at < 7 * 864e5) await recordPayment(p.o, p.p, p.r);
}
async function cancelOrder() {
  if (!confirm('Cancel this order? Your items will be released.')) return;
  S.busy = true; render();
  try { var r = await db.rpc('grocery_cancel_order', { p_order_id: S.order.id, p_reason: null }); if (r.error) throw r.error; S.order = r.data; S.orders = null; toast('Order cancelled'); loadCatalog().catch(function () {}); }
  catch (e) { S.error = cleanErr(e); }
  S.busy = false; render();
}
async function sendAsk() {
  if (!S.session) return needSignIn('#/ask');
  var items = ASK.filter(function (a) { return S.picks[a[0]]; }).map(function (a) { return { key: a[0], label: a[1] }; });
  if (S.other.trim()) items.push({ label: S.other.trim() });
  if (!items.length) return;
  var notify = (document.getElementById('ask-notify') || {}).checked !== false;
  S.busy = true; S.error = ''; render();
  try {
    var r = await db.rpc('grocery_request_items', { p_items: items, p_note: null, p_notify: notify });
    if (r.error) throw r.error;
    S.sentCount = r.data || items.length; S.picks = {}; S.other = ''; S.myReq = null;
  } catch (e) { S.error = cleanErr(e); }
  S.busy = false; render();
}

document.addEventListener('click', function (e) {
  // Some phone browsers / app webviews report the tapped text itself as the
  // target; start from its element so every button still responds.
  var el = e.target && e.target.nodeType === 3 ? e.target.parentNode : e.target;
  var t = el && el.closest ? el.closest('button,[data-go]') : null; if (!t) return;
  var d = t.dataset;
  if (d.go) { e.preventDefault(); if (/\.html$/.test(d.go)) { location.href = d.go; } else go(d.go); return; }
  if (d.back) { e.preventDefault(); if (history.length > 1 && document.referrer.indexOf(location.origin) === 0) history.back(); else go(d.back); return; }
  if (d.cat !== undefined) { S.catF = d.cat; return render(); }
  if (d.clear) { S.q = ''; S.catF = ''; return render(); }
  if (d.add) { e.preventDefault(); return add(d.add, 1); }
  if (d.qty) { e.preventDefault(); return setQty(d.qty, (S.bag[d.qty] || 0) + Number(d.d)); }
  if (d.pq) { var p = findP(route.id); if (!p) return; var m = Math.max(1, maxQty(p)), nx = S.pq.n + Number(d.pq); if (nx > m) toast(limitMsg(m)); S.pq.n = Math.max(1, Math.min(m, nx)); return render(); }
  if (d.addn) { var n = S.pq.n; S.pq.n = 1; return add(d.addn, n); }
  if (d.buyn) { var bn = S.pq.n; S.pq.n = 1; S.bag[d.buyn] = 0; return add(d.buyn, bn, '#/checkout'); }
  if (d.pay) { S.payBy = d.pay; S.error = ''; return render(); }
  if (d.pick) { S.picks[d.pick] = !S.picks[d.pick]; return render(); }
  if (d.again) {
    e.preventDefault(); var o = (S.orders || []).filter(function (x) { return x.id === d.again; })[0]; if (!o) return;
    var any = false; o.items.forEach(function (i) { var p2 = findP(i.product_id); if (p2 && maxQty(p2) > 0) { S.bag[i.product_id] = Math.min(i.qty, maxQty(p2)); any = true; } });
    writeJSON(BAG_KEY, S.bag); if (any) go('#/checkout'); else toast('These items are sold out right now'); return;
  }
  if (t.id === 'place') return placeOrder();
  if (t.id === 'paynow') return payOrder(S.order);
  if (t.id === 'cancel') return cancelOrder();
  if (t.id === 'ask-send') return sendAsk();
  if (t.id === 'ask-back') { S.sentCount = 0; return go('#/'); }
  if (t.id === 'signin') return needSignIn();
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'ns-search') { S.q = e.target.value; render(); }
  if (e.target.id === 'ask-other') { var had = !!S.other.trim(); S.other = e.target.value; if (had !== !!S.other.trim()) render(); }
});
window.addEventListener('hashchange', onRoute);
document.addEventListener('visibilitychange', function () { if (!document.hidden && route.name === 'store') loadCatalog().then(render).catch(function () {}); });

// Start: show the saved catalog at once, then refresh
(async function start() {
  if (S.cat) pruneBag();
  route = parse(); render();
  if (!db) { S.error = 'Could not connect. Please check your internet.'; return render(); }
  await signedIn();
  db.auth.onAuthStateChange(function (ev, sess) { S.session = sess; if (ev === 'SIGNED_OUT') { S.me = null; S.staff = false; S.owner = false; S.orders = null; S.myReq = null; } });
  try { await loadCatalog(); } catch (e) { if (!S.cat) { S.cat = { open: false, products: [], settings: {} }; toast(cleanErr(e)); } }
  onRoute();
  if (S.session) loadMe().then(render);
  retryPendingPayment().catch(function () {});
})();
})();
</script>
